name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build -c Release --no-restore

    - name: Run tests
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Create artifact
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish -c Release -o ./publish

    - name: Upload artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ef-migration-diff-release
        path: ./publish

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Code analysis
      run: dotnet build --no-restore /p:TreatWarningsAsErrors=true

    - name: Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build Docker image
      run: docker build -t ef-migration-diff:latest .

    - name: Test Docker image
      run: docker run --rm ef-migration-diff:latest --version

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag ef-migration-diff:latest sarmkadan/ef-migration-diff:latest
        docker tag ef-migration-diff:latest sarmkadan/ef-migration-diff:1.2.0
        docker push sarmkadan/ef-migration-diff:latest
        docker push sarmkadan/ef-migration-diff:1.2.0

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerabilities
      run: dotnet list package --vulnerable

  release:
    runs-on: ubuntu-latest
    needs: [build, code-quality, docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ef-migration-diff-release
        path: ./publish

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/**
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
